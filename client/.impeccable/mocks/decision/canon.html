<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard sketch</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:#0A171E;color:#fff;font-family:Archivo,sans-serif}
nav{height:80px;display:flex;align-items:center;padding:0 112px;gap:32px;color:#B7C6CC;font-size:15px}
nav b{color:#fff;font-size:24px;margin-right:auto}
nav a{background:#FF8A3D;color:#0A171E;padding:12px 20px;border-radius:999px;font-weight:600}
.hero{padding:120px 112px 0;max-width:1100px}
h1{font-size:84px;line-height:1;font-weight:700;letter-spacing:-.03em}
h1 em{font-style:normal;color:#FF8A3D}
p{margin-top:28px;font-size:20px;color:#B7C6CC;max-width:640px;line-height:1.55}
.b{display:flex;gap:12px;margin-top:40px}.b a{padding:18px 28px;border-radius:999px;border:1.5px solid #ffffff55;font-weight:600}.b a:first-child{background:#FF8A3D;color:#0A171E;border-color:#FF8A3D}
.cards{position:absolute;left:112px;right:112px;top:690px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.cards div{height:170px;border-radius:20px;background:#152D37;padding:24px;font-weight:600;font-size:20px}
</style></head><body>
<nav><b>vorcove</b><span>Services</span><span>Industries</span><span>Products</span><span>About</span><a>Book a call</a></nav>
